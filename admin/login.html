<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PelotonHub Admin — Sign In</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%230b0b0a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%230b0b0a'/%3E%3Cline x1='16' y1='16' x2='16' y2='3' stroke='%230b0b0a' stroke-width='2'/%3E%3Cline x1='16' y1='16' x2='26' y2='22' stroke='%230b0b0a' stroke-width='2'/%3E%3Cline x1='16' y1='16' x2='6' y2='22' stroke='%230b0b0a' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <div class="admin-login-brand"><span>Peloton<span class="dot">Hub</span></span></div>
    <p class="admin-login-eyebrow">Shop Admin Console</p>

    <form id="admin-login-form">
      <div class="form-group">
        <label for="al-email">Email</label>
        <input id="al-email" name="email" type="email" placeholder="admin@pelotonhub.ph"
               value="admin@pelotonhub.ph" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="al-pass">Password</label>
        <input id="al-pass" name="password" type="password" placeholder="••••••••"
               value="admin123" autocomplete="current-password" required />
      </div>

      <p class="form-msg error" id="al-error" style="margin-bottom:0.8rem;" aria-live="polite"></p>

      <button class="btn-full" type="submit">Sign In to Admin</button>
    </form>

    <div class="admin-login-demo">
      Demo credentials are pre-filled &mdash; just click <strong>Sign In to Admin</strong>.<br>
      Email: <strong>admin@pelotonhub.ph</strong> &middot; Password: <strong>admin123</strong>
    </div>
    <a class="admin-login-back" href="../home.html">&larr; Back to PelotonHub storefront</a>
  </div>
</div>

<script type="module">
import { auth, onAuthStateChanged, apiAdminMe, apiAdminLogin } from '../js/firebase.js';

// Already logged in as admin → dashboard
const unsub = onAuthStateChanged(auth, async () => {
  unsub();
  const { admin } = await apiAdminMe();
  if (admin) location.replace('index.html');
});

const errEl = document.getElementById('al-error');
document.getElementById('admin-login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('al-email').value.trim().toLowerCase();
  const password = document.getElementById('al-pass').value;
  if (!email || !password) {
    errEl.textContent = 'Email and password are required.';
    errEl.classList.add('show');
    return;
  }
  const res = await apiAdminLogin({ email, password });
  if (res.ok) {
    location.href = 'index.html';
  } else {
    errEl.textContent = 'Invalid credentials. Please check your email and password.';
    errEl.classList.add('show');
  }
});
</script>
</body>
</html>
