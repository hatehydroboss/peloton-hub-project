    <path style="fill:none;stroke:var(--ico-accent,#ff4d23);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" d="M10 20.2v-5.2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5.2"/>
  </symbol>
