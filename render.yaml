# Render blueprint for the PelotonHub payment server (server/ — Node + MongoDB + PayMongo).
# Render → New → Blueprint → pick this GitHub repo. Secrets marked sync:false are typed in
# on Render's dashboard and are never stored in GitHub.
services:
  - type: web
    name: pelotonhub-payments
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_UIDS
        value: ZqjawJwtSOd9acDJNtNq1ZMnGZ83
      - key: FIREBASE_PROJECT_ID
        value: peletonhub
      - key: APP_URLS
        value: https://pelotonhub.web.app,https://peletonhub.web.app,https://localhost,http://localhost:5500,http://127.0.0.1:5500
      - key: CORS_ORIGIN
        value: https://pelotonhub.web.app,https://peletonhub.web.app,https://peletonhub.firebaseapp.com,https://localhost,http://localhost:5500,http://127.0.0.1:5500
